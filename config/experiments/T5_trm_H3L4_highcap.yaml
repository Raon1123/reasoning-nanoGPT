# T5: TRM H=3, L=4 — higher capacity variant
#
# Increases n_embd: 256 → 512, n_head: 8 → 8 (head_dim: 32 → 64)
# This roughly 4x the parameter count while keeping the same recurrence structure.
# Samsung TRM paper shows larger models do not always win on ARC-AGI (weight sharing
# is the key), but higher capacity may help with complex pixel-level reasoning.
#
# LR lowered further to 1e-4 because larger models tend to need smaller LR.
# Longer warmup (10k) to stabilize the larger model's initial gradient noise.
#
# If this OOMs, reduce batch_size to 16 or n_embd to 384.

logging:
  wandb_run_name: T5_trm_H3L4_highcap
  output_dir: outputs/
  wandb_log: true
  wandb_project: reasoning_nanoGPT_ablations
  eval_only: false
  eval_interval: 2000
  eval_iters: 50
  always_save_checkpoint: true
  init_from: scratch
device: cuda
seed: 42
dataset:
  type: arc_agi1
  data_path: data/arc_agi/processed_data
  config: {seed: 42, shuffle: true, num_workers: 0, pin_memory: true}
model:
  type: trm
  dtype: float16
  compile: false
  ignore_idx: false
  config:
    H_cycles: 3
    L_cycles: 4
    n_layer: 4
    n_head: 8
    n_embd: 512
    dropout: 0.0
    bias: false
    sparsity: 1.0
    puzzle_emb_ndim: 0
    activation: swiglu
    expansion: 2.667
    normalize: rmsnorm
    pos_encodings: rotary
    rope_theta: 10000.0
training:
  test_batch_size: 16
  batch_size: 16
  gradient_accumulation_steps: 1
  block_size: 900
  max_iters: 300000
  optimizer:
    type: adamw
    config: {lr: 1.0e-4, betas: [0.9, 0.95], weight_decay: 0.1}
    grad_clip: 1.0
  scheduler:
    type: compose
    config: {warmup_iters: 10000, lr_decay_iters: 300000, min_lr: 1.0e-5}
